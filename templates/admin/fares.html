{% extends "base.html" %}{% block body %}{% include "admin/_nav.html" %}
<h1>Fares &amp; settings</h1>
<table><tr><th>Train type</th><th>Class</th><th>৳ / km</th><th>Min fare</th><th></th></tr>
{% for r in rates %}<tr><form method="post" action="{{ url_for('admin.save_rate') }}">
<td>{{ r.train_type }}<input type="hidden" name="train_type" value="{{ r.train_type }}"></td>
<td>{{ r.class_name }}<input type="hidden" name="class_id" value="{{ r.class_id }}"></td>
<td><input name="rate_per_km" type="number" step="0.01" value="{{ r.rate_per_km }}"></td>
<td><input name="min_fare" type="number" step="0.01" value="{{ r.min_fare }}"></td><td><button>Save</button></td></form></tr>{% endfor %}</table>
<h2>Add / change a rate</h2>
<form class="card grid" method="post" action="{{ url_for('admin.save_rate') }}">
 <label>Train type<select name="train_type"><option>INTERCITY</option><option>MAIL_EXPRESS</option><option>COMMUTER</option><option>LOCAL</option></select></label>
 <label>Class<select name="class_id">{% for c in classes %}<option value="{{ c.class_id }}">{{ c.class_name }}</option>{% endfor %}</select></label>
 <label>৳ per km<input name="rate_per_km" type="number" step="0.01" required></label>
 <label>Min fare<input name="min_fare" type="number" step="0.01" value="0" required></label><button>Save</button></form>
<h2>Global settings</h2>
<form class="card grid" method="post" action="{{ url_for('admin.save_settings') }}">
 <label>VAT %<input name="vat_percent" type="number" step="0.01" value="{{ cfg.vat_percent }}"></label>
 <label>Service charge / ticket<input name="service_charge" type="number" step="0.01" value="{{ cfg.service_charge }}"></label>
 <label>Child discount %<input name="child_discount_pct" type="number" step="0.01" value="{{ cfg.child_discount_pct }}"></label>
 <label>Seat hold (minutes)<input name="hold_minutes" type="number" value="{{ cfg.hold_minutes }}"></label><button>Save</button></form>
{% endblock %}
